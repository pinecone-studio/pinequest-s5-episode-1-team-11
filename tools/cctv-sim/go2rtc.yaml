# go2rtc config for testing Halo's CCTV mode without a real camera.
# Docs: https://github.com/AlexxIT/go2rtc
api:
  listen: ":1984"
  # /monitor runs on another origin (localhost:3000 or Vercel).
  origin: "*"

webrtc:
  listen: ":8555"

streams:
  # A looping recording that acts like an IP camera. Put a clip next to this file.
  hall: ffmpeg:sample.mp4#video=h264#audio=opus
  # A real camera on the home network (replace user, password and address):
  # living: rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/102   # Hikvision
  # bedroom: rtsp://USER:PASSWORD@192.168.1.65:554/stream2                  # TP-Link Tapo
